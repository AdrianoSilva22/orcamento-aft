<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposta Comercial - AFT Reforma Engenharia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      background: #0f172a;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    .slide-deck {
      padding: 0;
      gap: 0;
    }

    /* BARRA FLUTUANTE DE IMPRESSÃO / SALVAR PDF */
    .print-floating-bar {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(16, 28, 51, 0.95);
      border: 1.5px solid #f8c300;
      border-radius: 50px;
      padding: 10px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      gap: 16px;
      color: #ffffff;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { top: -60px; opacity: 0; }
      to { top: 18px; opacity: 1; }
    }

    .print-bar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      padding-right: 12px;
      border-right: 1px solid #334155;
    }
    .print-bar-brand strong {
      color: #f8c300;
    }

    .btn-print-action {
      background: linear-gradient(135deg, #f8c300 0%, #e0aa00 100%);
      color: #0c1a30;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(248, 195, 0, 0.4);
      transition: all 0.2s;
    }
    .btn-print-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(248, 195, 0, 0.55);
    }

    .btn-back-action {
      background: #1e3357;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 50px;
      border: 1px solid #2d4c80;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-back-action:hover {
      background: #274373;
      border-color: #f8c300;
    }

    .print-tip {
      font-size: 11.5px;
      color: #94a3b8;
    }

    /* OCULTAR COMPLETAMENTE NA HORA DA IMPRESSÃO E NO PDF GERADO */
    @media print {
      body {
        background: transparent !important;
      }
      .print-floating-bar,
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA FLUTUANTE COM BOTÃO DE IMPRESSÃO / SALVAR PDF -->
  <div class="print-floating-bar no-print" id="printBar">
    <div class="print-bar-brand">
      <span>🏢</span>
      <span id="print-client-name">EDIFÍCIO CARVALHO</span>
    </div>

    <button class="btn-print-action" id="btnTriggerPrint" onclick="window.print()">
      <span>🖨️</span>
      <span>IMPRIMIR PROPOSTA</span>
    </button>

    <a href="orcamento.html" class="btn-back-action">
      <span>←</span>
      <span>Voltar ao Editor</span>
    </a>
  </div>

  <div class="slide-deck" id="slide-deck-container">
    <!-- Slides will be injected dynamically -->
  </div>

  <script src="./js/default-data.js"></script>
  <script src="./js/render-slides.js"></script>
  <script>
    (function() {
      // Check if custom data was passed in localStorage or query
      let data = defaultProposalData;
      try {
        const stored = localStorage.getItem('aft_proposal_data');
        if (stored) {
          data = JSON.parse(stored);
        }
      } catch (e) {
        console.warn('Using default data:', e);
      }

      if (!data.company.phone || data.company.phone.includes('8213')) {
        data.company.phone = "(81) 9 9238-2246";
        data.company.whatsappLink = "https://wa.me/5581992382246";
      }

      // Check URL search params for quick overrides
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('client')) {
        data.proposal.clientName = urlParams.get('client');
      }

      // Atualiza nome na barra flutuante
      const clientLabel = document.getElementById('print-client-name');
      if (clientLabel && data.proposal && data.proposal.clientName) {
        clientLabel.textContent = data.proposal.clientName;
      }

      const container = document.getElementById('slide-deck-container');
      container.innerHTML = generateSlidesHTML(data);
      document.body.classList.add('rendered');
      window.isReadyForPDF = true;
    })();
  </script>
</body>
</html>
