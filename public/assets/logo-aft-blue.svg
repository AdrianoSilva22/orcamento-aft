<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <!-- Icon -->
  <g transform="translate(10, 10)">
    <!-- Window with 4 panes -->
    <rect x="36" y="44" width="9" height="9" fill="#0c3875" rx="1"/>
    <rect x="48" y="44" width="9" height="9" fill="#0c3875" rx="1"/>
    <rect x="36" y="56" width="9" height="9" fill="#0c3875" rx="1"/>
    <rect x="48" y="56" width="9" height="9" fill="#0c3875" rx="1"/>
    
    <!-- Left wall and lower base -->
    <path d="M 22 55 L 22 92 L 78 92" fill="none" stroke="#0c3875" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Primary roof apex -->
    <path d="M 12 56 L 46 22 L 88 56" fill="none" stroke="#0c3875" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Secondary double roof eave extension -->
    <path d="M 46 12 L 98 56" fill="none" stroke="#0c3875" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 52 5 L 106 50" fill="none" stroke="#0c3875" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- AFT REFORMA -->
    <text x="0" y="52" fill="#0c3875" font-family="'Montserrat', 'Inter', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="2.5">AFT REFORMA</text>
    
    <!-- Decorative lines and ENGENHARIA -->
    <line x1="2" y1="78" x2="80" y2="78" stroke="#0c3875" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <text x="96" y="83" fill="#0c3875" font-family="'Montserrat', 'Inter', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="7">ENGENHARIA</text>
    <line x1="300" y1="78" x2="378" y2="78" stroke="#0c3875" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
